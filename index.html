<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30일 러닝 인증 챌린지 | 같이 뛰자 하루 러닝</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #FFFDF4; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const C = {
      yellow: "#F2C744",
      yellowLight: "#FBE8A0",
      yellowDark: "#C9A200",
      bg: "#FFFDF4",
      bgDark: "#1A1A1A",
      text: "#1A1A1A",
      textSub: "#555555",
      textMuted: "#888888",
      white: "#FFFFFF",
      border: "#E8E0C8",
      success: "#2D9E6B",
      red: "#E03030",
    };

    const FONT = `'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif`;

    function useInView(threshold = 0.15) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(
          ([e]) => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } },
          { threshold }
        );
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return [ref, visible];
    }

    function Reveal({ children, delay = 0 }) {
      const [ref, visible] = useInView();
      return (
        <div ref={ref} style={{
          opacity: visible ? 1 : 0,
          transform: visible ? "translateY(0)" : "translateY(28px)",
          transition: `opacity 0.6s ease ${delay}s, transform 0.6s ease ${delay}s`,
        }}>
          {children}
        </div>
      );
    }

    function Section({ children, bg = C.white, id, style = {} }) {
      return (
        <section id={id} style={{
          background: bg, padding: "72px 24px", fontFamily: FONT, ...style,
        }}>
          <div style={{ maxWidth: 680, margin: "0 auto" }}>
            {children}
          </div>
        </section>
      );
    }

    function Tag({ children }) {
      return (
        <span style={{
          display: "inline-block",
          background: C.yellow, color: C.text,
          fontFamily: FONT, fontWeight: 700, fontSize: 12,
          padding: "4px 12px", borderRadius: 100,
          letterSpacing: "0.06em", textTransform: "uppercase",
          marginBottom: 16,
        }}>
          {children}
        </span>
      );
    }

    function SectionTitle({ tag, title, sub, center = false }) {
      return (
        <div style={{ textAlign: center ? "center" : "left", marginBottom: 40 }}>
          {tag && <Tag>{tag}</Tag>}
          <h2 style={{
            fontFamily: FONT, fontSize: "clamp(22px, 4vw, 30px)",
            fontWeight: 700, color: C.text,
            lineHeight: 1.45, margin: "0 0 14px",
            whiteSpace: "pre-line",
          }}>
            {title}
          </h2>
          {sub && (
            <p style={{
              fontFamily: FONT, fontSize: 15, color: C.textSub,
              lineHeight: 1.7, margin: 0,
            }}>
              {sub}
            </p>
          )}
        </div>
      );
    }

    function PainItem({ icon, text }) {
      return (
        <div style={{
          display: "flex", alignItems: "flex-start", gap: 12,
          padding: "16px 0", borderBottom: `1px solid ${C.border}`,
        }}>
          <span style={{ fontSize: 20, lineHeight: 1 }}>{icon}</span>
          <p style={{
            fontFamily: FONT, fontSize: 15, color: C.text,
            lineHeight: 1.6, margin: 0,
          }}>
            {text}
          </p>
        </div>
      );
    }

    function StepCard({ num, title, desc }) {
      return (
        <div style={{
          background: C.white, border: `1.5px solid ${C.border}`,
          borderRadius: 16, padding: "24px 20px",
        }}>
          <div style={{
            width: 36, height: 36, borderRadius: "50%",
            background: C.yellow, display: "flex",
            alignItems: "center", justifyContent: "center",
            fontFamily: FONT, fontWeight: 800, fontSize: 15,
            color: C.text, marginBottom: 12,
          }}>
            {num}
          </div>
          <h4 style={{
            fontFamily: FONT, fontWeight: 700, fontSize: 16,
            color: C.text, margin: "0 0 8px",
          }}>
            {title}
          </h4>
          <p style={{
            fontFamily: FONT, fontSize: 13, color: C.textSub,
            lineHeight: 1.6, margin: 0,
          }}>
            {desc}
          </p>
        </div>
      );
    }

    function BenefitRow({ icon, title, desc }) {
      return (
        <div style={{
          display: "flex", gap: 16, padding: "20px 0",
          borderBottom: `1px solid ${C.border}`,
          alignItems: "flex-start",

          <span style={{ fontSize: 28, lineHeight: 1, flexShrink: 0, marginTop: 2 }}>{icon}</span>
          <div>
            <p style={{ fontFamily: FONT, fontWeight: 700, fontSize: 15, color: C.text, margin: "0 0 4px" }}>
              {title}
            </p>
            <p style={{ fontFamily: FONT, fontSize: 13, color: C.textSub, lineHeight: 1.65, margin: 0 }}>
              {desc}
            </p>
          </div>
        </div>
      );
    }

    const benefits = [
      {
        icon: "✅",
        title: "주 3회 러닝 인증 시스템",
        desc: "매주 요일을 정해 단톡방에 러닝 인증샷을 올립니다. 혼자였다면 '오늘 쉬지 뭐'가, 여기선 '오늘도 달렸다'로 바뀝니다.",
      },
      {
        icon: "💰",
        title: "보증금 환급 시스템",

                주변 친구 10명을 러닝에 입문시켰어.
              </p>
              <p style={{ fontFamily: FONT, fontSize: 15, color: C.text, lineHeight: 1.85, margin: 0 }}>
                특별한 방법이 있었던 게 아니야.<br />
                <strong>같이 달렸을 뿐이야.</strong>
              </p>
            </Reveal>
            <Reveal delay={0.2}>
              <div style={{ display: "flex", gap: 24, marginTop: 32, flexWrap: "wrap" }}>
                {[
                  { num: "4년", label: "러닝 경력" },
                  { num: "10명+", label: "러닝 입문 친구" },
                  { num: "하프마라톤", label: "완주" },

                  <div key={label} style={{ textAlign: "center", flex: "1 1 80px" }}>
                    <p style={{ fontFamily: FONT, fontWeight: 800, fontSize: "clamp(20px, 4vw, 26px)", color: C.yellowDark, margin: "0 0 4px" }}>
                      {num}
                    </p>
                    <p style={{ fontFamily: FONT, fontSize: 12, color: C.textSub, margin: 0 }}>{label}</p>
                  </div>

          </Section>

          {/* SOLUTION */}

            <Reveal>
              <SectionTitle tag="해결책" title="왜 '같이 달리면' 달라질까?" />
            </Reveal>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 16 }}>
              <Reveal delay={0.1}>
                <StepCard num="1" title="커뮤니티 = 외부 책임감" desc="인증샷 하나가 '오늘 쉬지 뭐'를 막아줘. 남들도 올리는 걸 보면 나도 달리고 싶어진다." />
              </Reveal>
              <Reveal delay={0.2}>
                <StepCard num="2" title="보증금 = 행동 트리거" desc="₩20,000이 걸려있으면 움직인다. 심리학적으로 손실 회피 본능이 의지를 대신해줘." />

              {weekCurriculum.map((w, i) => (
                <Reveal key={w.week} delay={i * 0.1}>

                    <button
                      onClick={() => setOpen(open === i ? null : i)}
                      style={{
                        width: "100%", background: "none", border: "none",
                        cursor: "pointer", padding: "18px 20px",
                        display: "flex", justifyContent: "space-between",

                    >
                      <span style={{ fontFamily: FONT, fontWeight: 700, fontSize: 15, color: C.text }}>

            <Reveal>

            </Reveal>
            {[
              { q: "러닝을 한 번도 해본 적 없어도 괜찮아요?", a: "완전 처음인 분들을 위해 만든 챌린지예요. 첫 주는 신발 신고 나가는 것부터 같이 시작해요." },
              { q: "주 3회가 부담스러우면요?", a: "부담스럽다는 느낌 자체가 정상이에요. 그래서 커뮤니티가 있고, 보증금이 있어요. 처음엔 10분만 걸어도 인증 가능해요." },
              { q: "보증금 환급 조건이 뭐예요?", a: "30일 동안 주 3회 이상(총 12회 이상) 단톡방에 러닝 인증샷을 올리면 전액 돌려드려요." },
              { q: "서울에 안 살면요?", a: "오프라인 한강 러닝은 선택 참여예요. 온라인 단톡방과 인증 시스템은 전국 어디서나 참여할 수 있어요." },
            ].map(({ q, a }, i) => (
              <Reveal key={i} delay={i * 0.08}>
                <div style={{ borderBottom: `1px solid ${C.border}`, padding: "18px 0" }}>
                  <button
                    onClick={() => setOpen(open === `faq${i}` ? null : `faq${i}`)}
                    style={{
                      width: "100%", background: "none", border: "none",
                      cursor: "pointer", padding: 0,
                      display: "flex", justifyContent: "space-between",
                      alignItems: "center", textAlign: "left", gap: 16,
                    }}
                  >
                    <span style={{ fontFamily: FONT, fontWeight: 600, fontSize: 14, color: C.text }}>{q}</span>
                    <span style={{ fontSize: 16, color: C.textMuted, flexShrink: 0 }}>{open === `faq${i}` ? "▲" : "▼"}</span>
                  </button>
                  {open === `faq${i}` && (
                    <p style={{ fontFamily: FONT, fontSize: 13, color: C.textSub, lineHeight: 1.7, margin: "12px 0 0" }}>
                      {a}
                    </p>
                  )}
                </div>
              </Reveal>
            ))}
          </Section>

          {/* FINAL CTA */}
          <Section bg={C.yellow} style={{ textAlign: "center", padding: "64px 24px" }}>
            <Reveal>
              <h2 style={{
                fontFamily: FONT, fontWeight: 800,
                fontSize: "clamp(22px, 4.5vw, 32px)",
                color: C.text, lineHeight: 1.4, margin: "0 0 16px",
              }}>
                맨 뒤에서 달려도 괜찮아.<br />끝까지 가면 된다.
              </h2>
              <p style={{ fontFamily: FONT, fontSize: 15, color: "#444", lineHeight: 1.7, margin: "0 0 32px" }}>
                6월 1일 시작 · 선착순 10명 · 지금 신청하면 준비 가이드 먼저 드려요.
              </p>
              <a
                href={KAKAO_PAID}
                target="_blank"
                rel="noopener noreferrer"
                style={{
                  display: "inline-block", background: C.bgDark, color: C.white,
                  fontFamily: FONT, fontWeight: 800, fontSize: 16,
                  padding: "16px 36px", borderRadius: 100, textDecoration: "none",
                }}
              >
                신청하기 →
              </a>
            </Reveal>
          </Section>

          {/* FOOTER */}
          <footer style={{ background: C.bgDark, padding: "32px 24px", textAlign: "center" }}>
            <p style={{ fontFamily: FONT, fontSize: 12, color: "#666", margin: "0 0 4px" }}>
              30일 러닝 인증 챌린지 · 코치 전하루
            </p>
            <p style={{ fontFamily: FONT, fontSize: 11, color: "#555", margin: "0 0 8px" }}>
              채팅방: 같이 뛰자 하루 러닝
            </p>
            <a href={KAKAO_PAID} target="_blank" rel="noopener noreferrer"
              style={{ fontFamily: FONT, fontSize: 11, color: C.yellow, textDecoration: "none" }}>
              {KAKAO_LINK}
            </a>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
